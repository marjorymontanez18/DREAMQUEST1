<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Customers — DREAM QUEST</title>
    <link rel="stylesheet" href="style.css">
    <script src="auth.js"></script>
    <script>DQAuth.protect('admin')</script>
</head>

<body>
    <div class="app">
        <aside class="side" id="side"></aside>
        <script>DQAuth.mountSide('customers')</script>
        <main class="main">
            <h1>Customers</h1>
           
            <div class="tw">
                <table>
                    <thead>
                        <tr>
                            <th>Customer</th>
                            <th>Contact</th>
                            <th>Rental History</th>
                            <th>Orders</th>
                        </tr>
                    </thead>
                    <tbody id="cb"></tbody>
                </table>
            </div>
        <div class="empty" id="none" style="display:none"><h3>NO CUSTOMERS YET</h3></div></main>
    </div>
<script src="shop.js"></script>
<script>(function(){
var E=DQ.esc,low=function(x){return String(x||'').trim().toLowerCase()},orders=DQ.get('dqBookings',[]),map={},order=[];
function slot(k,init){if(!map[k]){map[k]=init;order.push(k)}return map[k]}
DQAuth.users().filter(function(u){return u.role==='customer'}).forEach(function(u){slot('id:'+u.id,{n:u.name,c:[u.email,u.phone].filter(Boolean).join(' · '),acct:'Registered '+new Date(u.createdAt).toLocaleDateString(),o:[],u:u})});
orders.forEach(function(b){
  var k=null;order.forEach(function(x){var u=map[x].u;if(u&&(b.userId===u.id||(low(b.email)&&low(b.email)===low(u.email))))k=x});
  if(!k)k='guest:'+(b.phone||b.name);
  slot(k,{n:b.name,c:b.phone+(b.email?' · '+b.email:''),acct:'Guest (no account)',o:[]}).o.push(b)});
var r=order.map(function(k){var c=map[k];return '<tr><td>'+E(c.n)+'<br><small class="muted">'+E(c.acct)+'</small></td><td>'+E(c.c)+'</td><td>'+(c.o.map(function(b){return E(b.eventType||'Event')+', '+E(b.eventDate)}).join('<br>')||'—')+'</td><td>'+(c.o.map(function(b){return E(b.id)+' ('+E(b.status)+')'}).join('<br>')||'—')+'</td></tr>'});
document.getElementById('cb').innerHTML=r.join('');document.getElementById('none').style.display=r.length?'none':'block'})()</script>
</body>

</html>
