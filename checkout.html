                        ESSENTIALS</small></span></a><input type="checkbox" id="t"><label for="t"

    <section><div class="wrap"><h1>Checkout</h1>
<div class="co" id="co"><form id="bf"><label>Full name<input id="name" required></label><label>Mobile number<input id="phone" type="tel" required pattern="[0-9+ \-]{7,}"></label><label class="full">Email address<input id="email" type="email"></label><label>Event name<input id="eventName" placeholder="e.g. Maria &amp; Jon's Wedding"></label><label>Event type<select id="eventType"><option>Wedding</option><option>Birthday</option><option>Corporate</option><option>Family Gathering</option><option>Other</option></select></label><label>Rental start / event date<input id="start" type="date" required></label><label>Payment<select id="payment"><option>Cash on delivery / pick-up</option><option>GCash (details sent after confirmation)</option><option>Bank transfer (details sent after confirmation)</option></select></label><label class="full" id="alabel">Delivery address<input id="address" required></label><label class="full">Special instructions<textarea id="instructions" rows="3"></textarea></label><div class="full"><button class="btn fill" type="submit">Place Order</button></div></form><aside id="sumbox"></aside></div>
<div id="done" style="display:none"></div></div></section>
    <footer>
        <div class="wrap">
            <p class="brand" style="justify-content:center">DREAM QUEST — EVENT ESSENTIALS</p>
            
            <p><a href="login.html">Log In / Sign Up</a> · <a href="login.html?role=admin">Admin</a></p>
