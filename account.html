<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>My Dashboard — DREAM QUEST</title>
    <link rel="stylesheet" href="style.css">
    <script src="auth.js"></script>
    <script>DQAuth.protect('customer')</script>
</head>

<body>
    <div class="app">
        <aside class="side" id="side"></aside>
        <script>DQAuth.mountSide('dashboard')</script>
        <main class="main">
            <h1>Welcome, <span id="nm"></span></h1>
            <p class="muted">Here is a summary of your rentals with DREAM QUEST.</p>

            <div class="stats">
                <div class="stat"><b id="s1">0</b><span>Total Orders</span></div>
                <div class="stat"><b id="s2">0</b><span>Pending Orders</span></div>
                <div class="stat"><b id="s3">0</b><span>Confirmed Rentals</span></div>
                <div class="stat"><b id="s4">₱0</b><span>Total Spent</span></div>
            </div>
            <div class="btns" style="justify-content:flex-start;margin-top:0">
                <a class="btn fill" href="rentals.html">Browse Rentals</a><a class="btn" href="cart.html">View Cart</a><a class="btn" href="profile.html">Edit Profile</a>
            </div>

            <h2 id="orders">My Orders</h2>
            <div class="tw">
                <table>
                    <thead><tr><th>Order No.</th><th>Event</th><th>Event Date</th><th>Total</th><th>Status</th><th></th></tr></thead>
                    <tbody id="rows"></tbody>
                </table>
            </div>
            <div class="empty" id="none" style="display:none">
                <h3>NO ORDERS YET</h3>
                <p class="muted">Your orders will appear here after checkout.</p>
                <p><a class="btn fill" href="rentals.html">Start Renting</a></p>
            </div>

            <dialog id="dlg">
                <h2 id="dt"></h2>
                <dl class="dl" id="dd"></dl>
                <div class="bar"><button class="btn danger" id="cancel" type="button">Cancel Order</button><button class="btn" id="cl" type="button">Close</button></div>
            </dialog>
        </main>
    </div>
    <script src="shop.js"></script>
    <script>
        (function () {
            var me = DQAuth.user(), $ = function (i) { return document.getElementById(i) }, cur = null;
            $('nm').textContent = me.name.split(' ')[0];
            var low = function (s) { return String(s || '').trim().toLowerCase() };
            function mine() {
                return DQ.get('dqBookings', []).filter(function (b) { return b.userId === me.id || (low(b.userEmail || b.email) && low(b.userEmail || b.email) === low(me.email)) })
                    .sort(function (a, b) { return String(b.createdAt).localeCompare(String(a.createdAt)) });
            }
            function render() {
                var l = mine(), paid = l.filter(function (b) { return b.status === 'Confirmed' || b.status === 'Completed' });
                $('s1').textContent = l.length;
                $('s2').textContent = l.filter(function (b) { return b.status === 'Pending' }).length;
                $('s3').textContent = l.filter(function (b) { return b.status === 'Confirmed' }).length;
                $('s4').textContent = DQ.peso(paid.reduce(function (s, b) { return s + (b.total || 0) }, 0));
                $('none').style.display = l.length ? 'none' : 'block';
                $('rows').innerHTML = l.map(function (b) {
                    return '<tr><td>' + DQ.esc(b.id) + '</td><td>' + DQ.esc(b.eventName || b.eventType || '—') + '</td><td>' + DQ.esc(b.eventDate) + '</td><td>' + DQ.peso(b.total || 0) + '</td><td><span class="st ' + DQ.esc(b.status) + '">' + DQ.esc(b.status) + '</span></td><td><button class="btn sm" data-id="' + DQ.esc(b.id) + '" type="button">View</button></td></tr>';
                }).join('');
            }
            function row(k, v) { return '<dt>' + k + '</dt><dd>' + DQ.esc(v || '—') + '</dd>' }
            $('rows').addEventListener('click', function (e) {
                var id = e.target.getAttribute('data-id'); if (!id) return;
                cur = mine().filter(function (b) { return b.id === id })[0]; if (!cur) return;
                $('dt').textContent = 'Order ' + cur.id;
                $('dd').innerHTML = row('Status', cur.status) + row('Event', (cur.eventName || '') + (cur.eventType ? ' (' + cur.eventType + ')' : '')) + row('Event date', cur.eventDate) + row('Rental period', (cur.start || '—') + ' to ' + (cur.end || '—')) + row(cur.service || 'Service', cur.address) + row('Items', cur.quantities) + row('Total', DQ.peso(cur.total || 0) + ' (+ ' + DQ.peso(cur.deposit || 0) + ' refundable deposit)') + row('Payment', cur.payment) + row('Placed on', cur.createdAt ? new Date(cur.createdAt).toLocaleString() : '');
                $('cancel').style.display = cur.status === 'Pending' ? '' : 'none';
                $('dlg').showModal();
            });
            $('cancel').onclick = function () {
                if (!cur || !confirm('Cancel order ' + cur.id + '?')) return;
                var all = DQ.get('dqBookings', []);
                all.forEach(function (b) { if (b.id === cur.id) b.status = 'Cancelled' });
                DQ.set('dqBookings', all); $('dlg').close(); render();
            };
            $('cl').onclick = function () { $('dlg').close() };
            render();
        })();
    </script>
</body>

</html>
