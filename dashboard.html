<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Dashboard — DREAM QUEST</title>
    <link rel="stylesheet" href="style.css">
    <script>if (sessionStorage.getItem('dqAdmin') !== '1') location.replace('admin.html')</script>
</head>

<body>
    <div class="app">
        <aside class="side">
            <div class="brand"><span class="dq">DQ</span><span>DREAM QUEST<small>EVENT ESSENTIALS</small></span></div><a
                href="dashboard.html" class=on>Dashboard</a><a href="bookings.html">Orders</a><a
                href="rentals.html">Products</a><a href="rentals.html#chairs">Inventory</a><a
                href="customers.html">Customers</a><a href="settings.html">Settings</a><a href="index.html">Back to
                Website</a><a href="admin.html" onclick="sessionStorage.removeItem('dqAdmin')">Log Out</a>
        </aside>
        <main class="main">
            <h1>Dashboard</h1>
            
            <div class="stats"><div class="stat"><b id="s1">0</b><span>Total Orders</span></div><div class="stat"><b id="s2">0</b><span>Pending Orders</span></div><div class="stat"><b id="s3">0</b><span>Active Rentals</span></div><div class="stat"><b id="s4">₱0</b><span>Confirmed Revenue</span></div></div>
<h2>Recent Orders</h2><div class="tw"><table><thead><tr><th>Order No.</th><th>Customer</th><th>Event Date</th><th>Total</th><th>Status</th><th>Action</th></tr></thead><tbody id="rec"></tbody></table></div>
<div class="empty" id="none"><h3>NO ORDERS YET</h3><p class="muted">Customer orders will appear here.</p></div></main>
    </div>
    <script>(function(){var l=DQ.get('dqBookings',[]),ok=l.filter(function(b){return b.status==='Confirmed'||b.status==='Completed'});
document.getElementById('s1').textContent=l.length;document.getElementById('s2').textContent=l.filter(function(b){return b.status==='Pending'}).length;document.getElementById('s3').textContent=l.filter(function(b){return b.status==='Confirmed'}).length;document.getElementById('s4').textContent=DQ.peso(ok.reduce(function(s,b){return s+(b.total||0)},0));
document.getElementById('none').style.display=l.length?'none':'block';
document.getElementById('rec').innerHTML=l.slice().sort(function(a,b){return String(b.createdAt).localeCompare(String(a.createdAt))}).slice(0,8).map(function(b){return '<tr><td>'+DQ.esc(b.id)+'</td><td>'+DQ.esc(b.name)+'</td><td>'+DQ.esc(b.eventDate)+'</td><td>'+DQ.peso(b.total||0)+'</td><td><span class="st '+DQ.esc(b.status)+'">'+DQ.esc(b.status)+'</span></td><td><a href="bookings.html">Manage</a></td></tr>'}).join('')})()</script>
<script src="shop.js"></script>
</body>

</html>
