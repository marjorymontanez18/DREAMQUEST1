<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Dream Quest Event Essentials</title>
    <style>
        :root {
            --bg: #050505;
            --panel: #100E07;
            --gold: #D4A52C;
            --lt: #F1D27A;
            --mut: #b39a58;
            --line: #3a2f12;
            color-scheme: dark;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            margin: 0;
            min-height: 100%
        }

        body {
            background: radial-gradient(ellipse at 50% 0%, #1c1407, #050505 60%) fixed;
            color: var(--mut);
            font-family: system-ui, Segoe UI, Arial, sans-serif;
            font-size: 15px
        }

        h1,
        h2,
        h3,
        .serif {
            font-family: Georgia, "Times New Roman", serif;
            color: var(--lt);
            font-weight: 600;
            margin: 0
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: center
        }

        .logo b {
            border: 1px solid var(--gold);
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            color: var(--gold);
            font-family: Georgia, serif
        }

        .logo span {
            color: var(--gold);
            letter-spacing: .18em;
            font-family: Georgia, serif;
            font-size: 15px;
            line-height: 1.2
        }

        .logo small {
            display: block;
            font-size: 9px;
            letter-spacing: .3em;
            font-family: system-ui, sans-serif
        }

        .center {
            max-width: 720px;
            margin: 0 auto;
            padding: 60px 16px;
            text-align: center
        }

        .cards {
            display: flex;
            gap: 20px;
            margin-top: 24px;
            flex-wrap: wrap;
            justify-content: center
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--line);
            padding: 22px;
            flex: 1 1 280px;
            max-width: 340px
        }

        .card p {
            font-size: 13px;
            line-height: 1.7;
            margin: 10px 0 16px
        }

        .row {
            display: flex;
            gap: 12px
        }

        button,
        .btn {
            background: var(--gold);
            color: #1a1300;
            border: 1px solid var(--gold);
            padding: 11px 16px;
            letter-spacing: .12em;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            flex: 1
        }

        button.ghost {
            background: transparent;
            color: var(--gold)
        }

        button.sm {
            padding: 6px 10px;
            font-size: 11px;
            flex: none
        }

        button.red {
            background: transparent;
            color: #e07a5f;
            border-color: #e07a5f
        }

        button:disabled {
            opacity: .4;
            cursor: not-allowed
        }

        a.link {
            color: var(--lt);
            cursor: pointer;
            text-decoration: none
        }

        form.box {
            max-width: 380px;
            margin: 24px auto;
            background: var(--panel);
            border: 1px solid var(--line);
            padding: 24px;
            text-align: left
        }

        label {
            display: block;
            font-size: 12px;
            letter-spacing: .08em;
            margin: 12px 0 4px;
            text-transform: uppercase
        }

        input,
        select,
        textarea {
            width: 100%;
            background: #0a0804;
            border: 1px solid var(--line);
            color: var(--lt);
            padding: 10px;
            font: inherit
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: 1px solid var(--gold)
        }

        .err {
            color: #e07a5f;
            font-size: 13px;
            min-height: 18px;
            margin-top: 10px
        }

        header {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            border-bottom: 1px solid var(--line);
            background: #0b0905
        }

        nav {
            display: flex;
            gap: 6px;
            flex-wrap: wrap
        }

        nav button {
            background: transparent;
            color: var(--mut);
            border-color: transparent;
            flex: none
        }

        nav button.on {
            color: var(--gold);
            border-color: var(--gold)
        }

        main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 24px 16px
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 16px;
            margin-top: 16px
        }

        .item {
            background: var(--panel);
            border: 1px solid var(--line);
            padding: 16px
        }

        .item .price {
            color: var(--gold);
            font-size: 18px;
            margin: 6px 0
        }

        .tw {
            overflow-x: auto;
            margin-top: 16px
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 560px
        }

        th,
        td {
            padding: 10px;
            border-bottom: 1px solid var(--line);
            text-align: left;
            font-size: 14px;
            vertical-align: middle
        }

        th {
            color: var(--gold);
            font-size: 11px;
            letter-spacing: .12em;
            text-transform: uppercase
        }

        td input,
        td select {
            padding: 6px
        }

        .empty {
            text-align: center;
            padding: 50px 10px;
            border: 1px dashed var(--line);
            margin-top: 16px
        }

        .tag {
            padding: 2px 8px;
            border: 1px solid var(--gold);
            color: var(--gold);
            font-size: 12px
        }

        .two {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px
        }

        .total {
            font-size: 20px;
            color: var(--lt);
            margin: 14px 0;
            font-family: Georgia, serif
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-top: 12px
        }

        .stats div {
            background: var(--panel);
            border: 1px solid var(--line);
            padding: 14px
        }

        .stats b {
            display: block;
            font-size: 22px;
            color: var(--lt);
            font-family: Georgia, serif
        }

        @media(max-width:560px) {
            .two {
                grid-template-columns: 1fr
            }
        }

        /* ---- customer dashboard + profile menu ---- */
        .pm {
            position: relative
        }

        .pmb {
            display: flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            color: var(--lt);
            border: 1px solid var(--line);
            padding: 4px 12px 4px 4px;
            border-radius: 40px;
            letter-spacing: .03em;
            text-transform: none;
            font-size: 13px;
            font-weight: 600;
            flex: none
        }

        .pmb:hover {
            border-color: var(--gold)
        }

        .pmb i {
            font: 700 14px Georgia, serif;
            font-style: normal;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--gold);
            color: #1a1300;
            display: grid;
            place-items: center
        }

        .pmm {
            position: absolute;
            right: 0;
            top: calc(100% + 8px);
            min-width: 220px;
            background: #000;
            border: 1px solid var(--gold);
            z-index: 30;
            box-shadow: 0 12px 30px #000c
        }

        .pmm .h {
            padding: 12px 14px;
            border-bottom: 1px solid var(--line);
            color: var(--lt);
            word-break: break-word
        }

        .pmm .h small {
            display: block;
            color: var(--mut)
        }

        .pmm button {
            display: block;
            width: 100%;
            text-align: left;
            background: transparent;
            color: var(--mut);
            border: 0;
            border-left: 2px solid transparent;
            letter-spacing: .06em
        }

        .pmm button:hover {
            color: var(--gold);
            border-left-color: var(--gold);
            background: var(--panel)
        }

        .dh {
            display: flex;
            align-items: center;
            gap: 22px;
            flex-wrap: wrap;
            padding: 28px;
            border: 1px solid var(--line);
            background: radial-gradient(ellipse at top left, #241b06, var(--panel) 70%)
        }

        .dh .av {
            width: 84px;
            height: 84px;
            border: 1px solid var(--gold);
            border-radius: 50%;
            display: grid;
            place-items: center;
            font: 2.3rem Georgia, serif;
            color: var(--gold)
        }

        .dh h1 {
            font-size: 30px
        }

        .dh .g {
            flex: 1;
            min-width: 220px
        }

        .dh .row {
            margin-top: 14px;
            max-width: 360px
        }

        .ds {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 14px;
            margin-top: 16px
        }

        .ds div {
            background: var(--panel);
            border: 1px solid var(--line);
            border-top: 2px solid var(--gold);
            padding: 16px
        }

        .ds b {
            display: block;
            font: 600 26px Georgia, serif;
            color: var(--lt)
        }

        .ds span {
            font-size: 11px;
            letter-spacing: .12em;
            text-transform: uppercase
        }

        .dn {
            display: flex;
            align-items: center;
            gap: 22px;
            flex-wrap: wrap;
            border: 1px solid var(--gold);
            background: linear-gradient(135deg, #1c1505, var(--panel));
            padding: 20px 24px;
            margin-top: 12px
        }

        .dn .n {
            text-align: center;
            min-width: 84px;
            padding-right: 22px;
            border-right: 1px solid var(--line)
        }

        .dn .n b {
            display: block;
            font: 600 44px/1 Georgia, serif;
            color: var(--lt)
        }

        .dn .n span {
            font-size: 10px;
            letter-spacing: .18em;
            text-transform: uppercase
        }

        .dn .i {
            flex: 1;
            min-width: 180px
        }

        .dq4 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 14px;
            margin-top: 12px
        }

        .dq4 button {
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
            background: var(--panel);
            color: var(--lt);
            border: 1px solid var(--line);
            padding: 18px 10px;
            text-transform: none;
            letter-spacing: .04em;
            font-size: 14px
        }

        .dq4 button:hover {
            border-color: var(--gold);
            color: var(--gold)
        }

        .dq4 i {
            font: normal 26px Georgia, serif;
            color: var(--gold)
        }

        .dq4 small {
            color: var(--mut);
            font-size: 12px;
            font-weight: 400
        }

        .oc {
            background: var(--panel);
            border: 1px solid var(--line);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px
        }

        .oc:hover {
            border-color: var(--gold)
        }

        .oc .t {
            display: flex;
            justify-content: space-between;
            align-items: center
        }

        .oc .t b {
            font-family: Georgia, serif;
            color: var(--lt)
        }

        .oc .f {
            display: flex;
            justify-content: space-between;
            margin-top: 6px;
            padding-top: 8px;
            border-top: 1px solid var(--line);
            color: var(--gold)
        }

        .sec {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-top: 30px
        }

        .sec a {
            color: var(--gold);
            cursor: pointer;
            font-size: 13px
        }

        .tag.Pending {
            color: #e6b94a;
            border-color: #e6b94a
        }

        .tag.Confirmed {
            color: #6fb5eb;
            border-color: #6fb5eb
        }

        .tag.Completed,
        .tag.Delivered,
        .tag.Returned {
            color: #6fcf97;
            border-color: #6fcf97
        }

        .tag.Cancelled {
            color: #eb6b6b;
            border-color: #eb6b6b
        }
        .popup-bg { position: fixed; inset: 0; background: #000b; display: grid; place-items: center; z-index: 100; padding: 16px }
        .popup { background: var(--panel); border: 1px solid var(--gold); padding: 28px 30px; width: 100%; max-width: 380px; text-align: center; box-shadow: 0 14px 44px #000; animation: pop .18s ease-out }
        .popup .ic { width: 54px; height: 54px; border-radius: 50%; margin: 0 auto 12px; display: grid; place-items: center; font: 700 26px Georgia, serif; border: 2px solid var(--gold); color: var(--gold) }
        .popup.err .ic { border-color: #eb6b6b; color: #eb6b6b }
        .popup h3 { margin: 0 0 6px; color: var(--lt) }
        .popup p { margin: 0 0 18px; color: var(--mut) }
        .popup .row { justify-content: center; flex-wrap: wrap }
        @keyframes pop { from { transform: scale(.92); opacity: 0 } to { transform: scale(1); opacity: 1 } }
    </style>
</head>

<body>
    <div id="app"></div>
    <script src="auth.js"></script>
    <script src="shop.js"></script>
    <script>
        /* Shared storage: the same keys the public website and the admin pages use, so everything is one system. */
        let db = { session: null, cart: [], users: [], products: [], orders: [] }, pDirty = false;
        const rd = (k, d) => { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : d } catch (e) { return d } };
        const toPortal = b => {
            const em = String(b.userEmail || b.email || "").toLowerCase();
            const us = db.users.find(x => x.id === b.userId) || db.users.find(x => x.email && x.email.toLowerCase() === em);
            return { ...b, userId: us ? us.id : (b.userId || ""), customer: b.name || (us && us.name) || "", items: (b.items || []).map(i => ({ pid: i.id, name: i.name, price: i.price, qty: i.qty })), days: b.days || 1, date: b.eventDate || b.start || "", total: b.total || 0, status: b.status || "Pending" };
        };
        const toShared = o => {
            const u = db.users.find(x => x.id === o.userId) || {}, end = new Date(o.date); end.setDate(end.getDate() + o.days - 1);
            const items = o.items.map(i => ({ id: i.pid, name: i.name, qty: i.qty, price: i.price, unit: (db.products.find(p => p.id === i.pid) || {}).unit || "item" }));
            return { id: o.id, createdAt: new Date(o.created).toISOString(), name: o.customer, phone: o.phone, email: u.email || "", eventName: "Rental order", eventType: "", eventDate: o.date, start: o.date, end: isNaN(end) ? o.date : end.toISOString().slice(0, 10), days: o.days, address: o.address || "(pick-up)", service: "Delivery", instructions: "", payment: "To be arranged", items, products: items.map(i => i.name), quantities: items.map(i => i.name + " x " + i.qty + " @ " + peso(i.price)).join("\n"), subtotal: o.total, fee: 0, deposit: Math.round(o.total * (CONFIG.depositRate || 0.2)), total: o.total, status: "Pending", userId: o.userId, userEmail: u.email || "" };
        };
        function refresh() {
            db.users = rd("dqUsers", []);
            const ss = rd("dqSession", null) || (() => { try { return JSON.parse(sessionStorage.getItem("dqSession")) } catch (e) { return null } })();
            db.session = ss ? ss.id : null;
            const sp = rd("dqProducts", null);
            db.products = (Array.isArray(sp) ? sp : DQ.PRODUCTS_DEFAULT).map(p => ({ ...p, available: p.avail !== false }));
            db.cart = rd("dqCart", []).filter(c => db.products.some(p => p.id === c.id)).map(c => ({ pid: c.id, qty: c.qty }));
            db.orders = rd("dqBookings", []).map(toPortal);
        }
        const save = () => {
            try {
                localStorage.setItem("dqUsers", JSON.stringify(db.users));
                localStorage.setItem("dqCart", JSON.stringify(db.cart.map(c => ({ id: c.pid, qty: c.qty }))));
                if (pDirty) localStorage.setItem("dqProducts", JSON.stringify(db.products.map(({ available, ...p }) => ({ ...p, avail: available !== false, cat: p.cat || "acc", unit: p.unit || "item", min: p.min || 1, desc: p.desc || "" }))));
                const cur = rd("dqBookings", []);
                db.orders.forEach(o => { const b = cur.find(x => x.id === o.id); if (b) { if (b.status !== o.status) b.status = o.status } else cur.push(toShared(o)) });
                localStorage.setItem("dqBookings", JSON.stringify(cur));
            } catch (e) { }
        };
        const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
        const peso = n => "₱" + Number(n).toLocaleString();
        const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
        const STATUS = ["Pending", "Confirmed", "Completed", "Cancelled"];
        let view = "welcome", tab = "catalog", msg = "", menuOpen = false, flash = "";
        { const qp = new URLSearchParams(location.search), r = qp.get("role"); if (r === "admin") view = "alogin"; else if (r === "customer") view = qp.get("mode") === "signup" ? "csignup" : "clogin" }
        document.addEventListener("click", e => { if (menuOpen && !e.target.closest(".pm")) { menuOpen = false; render() } });
        const me = () => db.users.find(u => u.id === db.session);
        const go = (v, t) => { view = v; if (t) tab = t; msg = ""; render() };
        const logo = `<div class="logo"><b>DQ</b><span>DREAM QUEST<small>EVENT ESSENTIALS</small></span></div>`;
        const $ = id => document.getElementById(id);

        function render() {
            refresh();
            const u = me();
            if (u && u.role === "admin" && view !== "admin") { view = "admin"; if (!["orders", "products", "customers"].includes(tab)) tab = "orders" }
            if (u && u.role === "customer" && view !== "customer") { view = "customer"; tab = "home" }
            if (!u && (view === "admin" || view === "customer")) view = "welcome";
            const A = $("app");
            if (view === "welcome") A.innerHTML = `<div class="center">${logo}<h1 style="margin-top:28px;font-size:30px;letter-spacing:.05em">Welcome</h1><p>Choose how you would like to continue.</p>
  <div class="cards"><div class="card"><h3>Customer</h3><p>Rent tables, chairs and event essentials, track your orders and manage your profile.</p><div class="row"><button onclick="go('clogin')">Log in</button><button class="ghost" onclick="go('csignup')">Sign up</button></div></div>
  <div class="card"><h3>Admin</h3><p>Manage orders, products, prices, stock and customers. Authorized staff only.</p><div class="row"><button onclick="go('alogin')">Log in</button></div></div></div><p style="margin-top:24px"><a class="link" href="index.html">← Back to Website</a></p></div>`;
            else if (view === "clogin" || view === "alogin") authForm(view === "alogin");
            else if (view === "csignup") signupForm();
            else if (view === "customer") customerUI(u);
            else adminUI(u);
        }
        function authForm(admin) {
            $("app").innerHTML = `<div class="center">${logo}<h2 style="margin-top:24px">${admin ? "Admin" : "Customer"} Log In</h2>
  <form class="box" onsubmit="return login(event,${admin})"><label>${admin ? "Username" : "Email"}</label><input id="e" required autocomplete="username"><label>Password</label><input id="p" type="password" required autocomplete="current-password">
  <div class="err">${esc(msg)}</div><button style="width:100%;margin-top:6px">Log in</button>
  ${admin ? "" : `<p style="text-align:center;font-size:13px">No account? <a class="link" onclick="go('csignup')">Sign up</a></p>`}</form>
  <a class="link" href="index.html">← Back to Website</a></div>`;
        }
        /* Pop-up message. kind: "ok" | "err" | "ask". btns: [{label, fn, ghost}] (default: one OK button) */
        function popup(kind, title, text, btns) {
            document.querySelectorAll(".popup-bg").forEach(x => x.remove());
            const bg = document.createElement("div"); bg.className = "popup-bg";
            bg.innerHTML = `<div class="popup ${kind}"><div class="ic">${kind === "err" ? "&#10005;" : kind === "ask" ? "?" : "&#10003;"}</div><h3>${esc(title)}</h3><p>${esc(text)}</p><div class="row"></div></div>`;
            const row = bg.querySelector(".row");
            (btns || [{ label: "OK" }]).forEach(b => { const x = document.createElement("button"); x.textContent = b.label; if (b.ghost) x.className = "ghost"; x.onclick = () => { bg.remove(); if (b.fn) b.fn() }; row.appendChild(x) });
            bg.onclick = e => { if (e.target === bg) bg.remove() };
            document.body.appendChild(bg);
        }
        document.addEventListener("keydown", e => { if (e.key === "Escape") document.querySelectorAll(".popup-bg").forEach(x => x.remove()) });
        function login(ev, admin) {
            ev.preventDefault();
            DQAuth.login({ id: $("e").value, password: $("p").value, role: admin ? "admin" : "customer", remember: true })
                .then(u => { refresh(); tab = admin ? "orders" : "home"; view = admin ? "admin" : "customer"; render(); popup("ok", "Login successful", "Welcome back, " + u.name.split(" ")[0] + "!") })
                .catch(err => { msg = ""; render(); popup("err", "Login failed", err.message) });
            return false;
        }
        function signupForm() {
            $("app").innerHTML = `<div class="center">${logo}<h2 style="margin-top:24px">Create Account</h2>
  <form class="box" onsubmit="return signup(event)"><label>Full name</label><input id="n" required><label>Email</label><input id="e" type="email" required>
  <label>Phone</label><input id="ph" required><label>Password</label><input id="p" type="password" minlength="8" required><small style="color:var(--mut)">At least 8 characters, with uppercase, lowercase, a number and a symbol.</small>
  <div class="err">${esc(msg)}</div><button style="width:100%">Sign up</button>
  <p style="text-align:center;font-size:13px">Have an account? <a class="link" onclick="go('clogin')">Log in</a></p></form><a class="link" href="index.html">← Back to Website</a></div>`;
        }
        function signup(ev) {
            ev.preventDefault(); const pw = $("p").value;
            DQAuth.signup({ role: "customer", name: $("n").value, email: $("e").value, phone: $("ph").value, password: pw, confirm: pw, address: "" })
                .then(u => { refresh(); tab = "home"; view = "customer"; render(); popup("ok", "Account created", "Welcome to DREAM QUEST, " + u.name.split(" ")[0] + "! You can now start renting.", [{ label: "Browse catalog", fn: () => { tab = "catalog"; render() } }, { label: "Close", ghost: true }]) })
                .catch(err => { msg = ""; render(); popup("err", "Sign up failed", err.message) });
            return false;
        }
        function logout() { popup("ask", "Log out?", "Are you sure you want to log out?", [{ label: "Yes, log out", fn: doLogout }, { label: "Stay logged in", ghost: true }]) }
        function doLogout() { try { localStorage.removeItem("dqSession"); sessionStorage.removeItem("dqSession") } catch (e) { } db.session = null; menuOpen = false; go("welcome"); popup("ok", "Logged out", "You have been logged out successfully. See you again soon!") }
        function shell(u, tabs) {
            const items = u.role === "customer" ? [["home", "My Dashboard"], ["myorders", "My Orders"], ["cart", "My Cart"], ["profile", "My Profile"]] : [];
            return `<header>${logo}<nav>${tabs.map(([k, l]) => `<button class="${tab === k ? "on" : ""}" onclick="tab='${k}';menuOpen=false;render()">${l}</button>`).join("")}</nav>
  <div class="pm"><button class="pmb" onclick="event.stopPropagation();menuOpen=!menuOpen;render()"><i>${esc(u.name.trim().charAt(0).toUpperCase())}</i>${esc(u.name.split(" ")[0])} &#9662;</button>${menuOpen ? `<div class="pmm"><div class="h">${esc(u.name)}<small>${esc(u.email)}</small></div>${items.map(([k, l]) => `<button onclick="tab='${k}';menuOpen=false;render()">${l}</button>`).join("")}<button onclick="menuOpen=false;logout()">Log out</button></div>` : ""}</div></header>`;
        }
        const itemCard = p => {
            const ok = p.available && p.stock > 0; return `<div class="item"><h3>${esc(p.name)}</h3><div class="price">${peso(p.price)} <small>/ day</small></div>
    <div>${ok ? p.stock + " in stock" : "Unavailable"}</div><div class="row" style="margin-top:10px"><input type="number" id="q${p.id}" min="${p.min || 1}" max="${p.stock}" value="${p.min || 1}" ${ok ? "" : "disabled"} style="width:70px"><button ${ok ? "" : "disabled"} onclick="addCart('${p.id}')">Add</button></div></div>`
        };
        function homeUI(u, mine) {
            const first = esc(u.name.split(" ")[0]), t0 = new Date(); t0.setHours(0, 0, 0, 0);
            const fl = flash ? `<div class="dn" style="margin:0 0 14px"><div class="i"><b>${esc(flash)}</b></div><button class="sm" onclick="tab='cart';render()">View cart</button></div>` : ""; flash = "";
            const ci = db.cart.map(c => ({ ...c, p: db.products.find(p => p.id === c.pid) })).filter(c => c.p);
            const cartBox = ci.length ? `<div class="sec"><h2>Your Cart</h2><a onclick="tab='cart';render()">Open cart →</a></div><div class="dn"><div class="i">${ci.map(c => esc(c.p.name) + " ×" + c.qty).join("<br>")}</div><div><div>${peso(ci.reduce((t, c) => t + c.p.price * c.qty, 0))} / day</div><button class="sm" style="margin-top:8px" onclick="tab='cart';render()">Checkout</button></div></div>` : "";
            const cnt = s => mine.filter(o => o.status === s).length, nItems = db.cart.reduce((s, c) => s + c.qty, 0);
            const spent = mine.filter(o => ["Confirmed", "Completed", "Delivered", "Returned"].includes(o.status)).reduce((s, o) => s + o.total, 0);
            const nx = mine.filter(o => ["Pending", "Confirmed", "Delivered"].includes(o.status) && o.date && new Date(o.date) >= t0).sort((a, b) => new Date(a.date) - new Date(b.date))[0];
            const sum = o => o.items.map(i => esc(i.name) + " ×" + i.qty).join(", ");
            const go2 = (k, i, a, b) => `<button onclick="tab='${k}';render()"><i>${i}</i>${a}<small>${b}</small></button>`;
            let nxt = "";
            if (nx) { const d = Math.max(0, Math.round((new Date(nx.date) - t0) / 864e5)); nxt = `<h2 style="margin-top:30px">Your Next Event</h2><div class="dn"><div class="n"><b>${d}</b><span>${d === 1 ? "day to go" : "days to go"}</span></div><div class="i"><span class="tag ${nx.status}">${nx.status}</span><h3 style="margin-top:6px">${esc(nx.id)} · ${esc(nx.date)}</h3><div>${sum(nx)}</div></div><button class="sm" onclick="tab='myorders';render()">View order</button></div>` }
            return `${fl}<div class="dh"><div class="av">${esc(u.name.trim().charAt(0).toUpperCase())}</div><div class="g"><div style="letter-spacing:.25em;font-size:11px">CUSTOMER DASHBOARD</div><h1>Welcome back, ${first}</h1><div>${esc(u.email)}</div>
  <div class="row"><button onclick="tab='catalog';render()">Browse Catalog</button><button class="ghost" onclick="tab='cart';render()">View Cart</button></div></div></div>
  <div class="ds"><div><b>${mine.length}</b><span>Total Orders</span></div><div><b>${cnt("Pending")}</b><span>Pending</span></div><div><b>${cnt("Confirmed") + cnt("Delivered")}</b><span>Active Rentals</span></div><div><b>${peso(spent)}</b><span>Total Spent</span></div></div>
  ${nxt}
  ${cartBox}
  <h2 style="margin-top:30px">Quick Actions</h2><div class="dq4">${go2("catalog", "&#9830;", "Rent Items", "Tables &amp; chairs")}${go2("cart", "&#9776;", "My Cart", nItems + " items")}${go2("myorders", "&#10022;", "My Orders", mine.length + " total")}${go2("profile", "&#9786;", "My Profile", "Details &amp; password")}</div>
  <div class="sec"><h2>Recent Orders</h2>${mine.length ? `<a onclick="tab='myorders';render()">View all →</a>` : ""}</div>
  ${mine.length ? `<div class="grid">${mine.slice(0, 3).map(o => `<div class="oc"><div class="t"><b>${esc(o.id)}</b><span class="tag ${o.status}">${o.status}</span></div><div>Event: ${esc(o.date)} · ${o.days} day(s)</div><div style="font-size:13px">${sum(o)}</div><div class="f"><span>Total</span><b>${peso(o.total)}</b></div></div>`).join("")}</div>` : `<div class="empty">No orders yet.<br><br><button class="sm" onclick="tab='catalog';render()">Start renting</button></div>`}
  <div class="sec"><h2>Rent Something New</h2><a onclick="tab='catalog';render()">Full catalog →</a></div><div class="grid">${db.products.slice(0, 4).map(itemCard).join("")}</div>`;
        }
        /* ---------- CUSTOMER ---------- */
        function customerUI(u) {
            const mine = db.orders.filter(o => o.userId === u.id).sort((a, b) => b.created - a.created);
            let body = "";
            if (tab === "home") body = homeUI(u, mine);
            else if (tab === "catalog") {
                body = `<h2>Rental Catalog</h2><div class="grid">${db.products.map(p => {
                    const ok = p.available && p.stock > 0; return `<div class="item"><h3>${esc(p.name)}</h3><div class="price">${peso(p.price)} <small>/ day</small></div>
    <div>${ok ? p.stock + " in stock" : "Unavailable"}</div><div class="row" style="margin-top:10px"><input type="number" id="q${p.id}" min="${p.min || 1}" max="${p.stock}" value="${p.min || 1}" ${ok ? "" : "disabled"} style="width:70px"><button ${ok ? "" : "disabled"} onclick="addCart('${p.id}')">Add</button></div></div>`
                }).join("")}</div>`;
            } else if (tab === "cart") {
                const items = db.cart.map(c => ({ ...c, p: db.products.find(p => p.id === c.pid) })).filter(c => c.p);
                const sub = items.reduce((s, c) => s + c.p.price * c.qty, 0);
                body = `<h2>Your Cart</h2>` + (!items.length ? `<div class="empty">Your cart is empty.<br><br><button class="sm" onclick="tab='catalog';render()">Browse catalog</button></div>` :
                    `<div class="tw"><table><tr><th>Item</th><th>Qty</th><th>Price/day</th><th></th></tr>${items.map(c => `<tr><td>${esc(c.p.name)}</td><td>${c.qty}</td><td>${peso(c.p.price)}</td><td><button class="red sm" onclick="rmCart('${c.pid}')">Remove</button></td></tr>`).join("")}</table></div>
    <form class="box" style="max-width:none" onsubmit="return placeOrder(event)"><div class="two"><div><label>Event date</label><input type="date" id="ed" required></div><div><label>Number of days</label><input type="number" id="dy" min="1" value="1" required oninput="calc(${sub})"></div></div>
    <label>Delivery address</label><textarea id="ad" rows="2" required>${esc(u.address)}</textarea>
    <div class="total" id="tt">Total: ${peso(sub)}</div><button style="width:100%">Place order</button></form>`);
            } else if (tab === "myorders") {
                body = `<h2>My Orders</h2>` + (!mine.length ? `<div class="empty">No orders yet.</div>` : `<div class="tw"><table><tr><th>Order</th><th>Event date</th><th>Items</th><th>Total</th><th>Status</th><th></th></tr>${mine.map(o => `<tr><td>${o.id}</td><td>${esc(o.date)}</td><td>${o.items.map(i => esc(i.name) + " ×" + i.qty).join(", ")}</td><td>${peso(o.total)}</td><td><span class="tag">${o.status}</span></td><td>${o.status === "Pending" ? `<button class="red sm" onclick="setStatus('${o.id}','Cancelled')">Cancel</button>` : ""}</td></tr>`).join("")}</table></div>`);
            } else {
                body = `<h2>My Profile</h2><form class="box" style="margin-left:0" onsubmit="return saveProfile(event)"><label>Full name</label><input id="n" value="${esc(u.name)}" required><label>Email</label><input value="${esc(u.email)}" disabled>
    <label>Phone</label><input id="ph" value="${esc(u.phone)}"><label>Default address</label><textarea id="ad" rows="2">${esc(u.address)}</textarea><label>Current password (only if changing it)</label><input id="cp" type="password"><label>New password (optional)</label><input id="p" type="password" minlength="6">
    <div class="err" style="color:var(--lt)">${esc(msg)}</div><button style="width:100%">Save profile</button></form>`;
            }
            $("app").innerHTML = shell(u, [["home", "Dashboard"], ["catalog", "Catalog"], ["cart", "Cart (" + db.cart.length + ")"], ["myorders", "My Orders"], ["profile", "Profile"]]) + `<main>${body}</main>`;
        }
        function addCart(pid) {
            const p = db.products.find(x => x.id === pid), q = Math.max(p.min || 1, parseInt($("q" + pid).value) || 1);
            const ex = db.cart.find(c => c.pid === pid); const n = Math.min(p.stock, (ex ? ex.qty : 0) + q);
            if (ex) ex.qty = n; else db.cart.push({ pid, qty: n }); save(); render();
            popup("ok", "Added to cart", p.name + " × " + q + " was added to your cart.", [{ label: "Go to checkout", fn: () => { tab = "cart"; render() } }, { label: "Continue shopping", ghost: true }]);
        }
        function rmCart(pid) { db.cart = db.cart.filter(c => c.pid !== pid); save(); render() }
        function calc(sub) { $("tt").textContent = "Total: " + peso(sub * Math.max(1, parseInt($("dy").value) || 1)) }
        function placeOrder(ev) {
            ev.preventDefault();
            if (!$("ed").value) { popup("err", "Event date needed", "Please choose your event date before placing the order."); return false }
            popup("ask", "Place this order?", $("tt").textContent + ". We will contact you to confirm availability.", [{ label: "Yes, place order", fn: confirmOrder }, { label: "Review cart", ghost: true }]);
            return false;
        }
        function confirmOrder() {
            const u = me(), days = Math.max(1, parseInt($("dy").value) || 1);
            const items = db.cart.map(c => { const p = db.products.find(x => x.id === c.pid); return p ? { pid: p.id, name: p.name, price: p.price, qty: c.qty } : null }).filter(Boolean);
            const bad = items.filter(i => { const p = db.products.find(x => x.id === i.pid); return !p.available || i.qty > p.stock });
            if (bad.length) { popup("err", "Item not available", "Some items are no longer available in that quantity: " + bad.map(i => i.name).join(", ") + ". Please update your cart."); return }
            const total = items.reduce((s, i) => s + i.price * i.qty, 0) * days;
            const max = db.orders.reduce((m, o) => Math.max(m, parseInt(String(o.id).replace(/\D/g, ""), 10) || 0), 0);
            const oid = "DQ-" + String(max + 1).padStart(4, "0");
            db.orders.push({ id: oid, userId: u.id, customer: u.name, phone: u.phone, items, days, date: $("ed").value, address: $("ad").value.trim(), total, status: "Pending", created: Date.now() });
            db.cart = []; save(); tab = "myorders"; render();
            popup("ok", "Order placed!", "Your order " + oid + " was sent. You can track its status in My Orders.", [{ label: "View my orders", fn: () => { tab = "myorders"; render() } }, { label: "Close", ghost: true }]);
        }
        function saveProfile(ev) {
            ev.preventDefault(); const u = me(); u.name = $("n").value.trim(); u.phone = $("ph").value.trim(); u.address = $("ad").value.trim(); save();
            const np = $("p").value;
            if (np) { DQAuth.changePassword(u.id, $("cp").value, np, np).then(() => { msg = "Profile and password saved."; render() }).catch(err => { msg = err.message; render() }); return false }
            msg = "Profile saved."; render(); return false;
        }
        function setStatus(id, s) { const o = db.orders.find(x => x.id === id); if (o) { o.status = s; save(); render() } }
        /* ---------- ADMIN ---------- */
        function adminUI(u) {
            const cust = db.users.filter(x => x.role === "customer"); let body = "";
            if (tab === "orders") {
                const rev = db.orders.filter(o => ["Confirmed", "Completed", "Delivered", "Returned"].includes(o.status)).reduce((s, o) => s + o.total, 0);
                body = `<h2>Orders</h2><div class="stats"><div><b>${db.orders.length}</b>Total orders</div><div><b>${db.orders.filter(o => o.status === "Pending").length}</b>Pending</div><div><b>${peso(rev)}</b>Confirmed revenue</div></div>` +
                    (!db.orders.length ? `<div class="empty">No orders yet.</div>` : `<div class="tw"><table><tr><th>Order</th><th>Customer</th><th>Event</th><th>Items</th><th>Total</th><th>Status</th></tr>${[...db.orders].reverse().map(o => `<tr><td>${o.id}</td><td>${esc(o.customer)}<br><small>${esc(o.phone)}</small></td><td>${esc(o.date)}<br><small>${o.days} day(s) · ${esc(o.address)}</small></td><td>${o.items.map(i => esc(i.name) + " ×" + i.qty).join(", ")}</td><td>${peso(o.total)}</td>
    <td><select onchange="setStatus('${o.id}',this.value)">${STATUS.map(s => `<option ${s === o.status ? "selected" : ""}>${s}</option>`).join("")}</select></td></tr>`).join("")}</table></div>`);
            } else if (tab === "products") {
                body = `<h2>Products</h2><div class="tw"><table><tr><th>Name</th><th>Price/day (₱)</th><th>Stock</th><th>Available</th><th></th></tr>${db.products.map(p => `<tr><td><input value="${esc(p.name)}" onchange="editP('${p.id}','name',this.value)"></td><td><input type="number" min="0" value="${p.price}" onchange="editP('${p.id}','price',+this.value)"></td><td><input type="number" min="0" value="${p.stock}" onchange="editP('${p.id}','stock',+this.value)"></td><td><input type="checkbox" ${p.available ? "checked" : ""} onchange="editP('${p.id}','available',this.checked)" style="width:auto"></td><td><button class="red sm" onclick="delP('${p.id}')">Delete</button></td></tr>`).join("")}</table></div>
    <form class="box" style="max-width:none;margin-left:0" onsubmit="return addP(event)"><h3>Add product</h3><div class="two"><div><label>Name</label><input id="pn" required></div><div><label>Price/day</label><input id="pp" type="number" min="0" required></div></div><label>Stock</label><input id="ps" type="number" min="0" required><div style="height:12px"></div><button>Add product</button></form>`;
            } else {
                body = `<h2>Customers</h2>` + (!cust.length ? `<div class="empty">No customers yet.</div>` : `<div class="tw"><table><tr><th>Name</th><th>Email</th><th>Phone</th><th>Orders</th><th></th></tr>${cust.map(c => `<tr><td>${esc(c.name)}</td><td>${esc(c.email)}</td><td>${esc(c.phone)}</td><td>${db.orders.filter(o => o.userId === c.id).length}</td><td><button class="red sm" onclick="delC('${c.id}')">Remove</button></td></tr>`).join("")}</table></div>`) +
                    `<form class="box" style="max-width:none;margin-left:0" onsubmit="return admPass(event)"><h3>Change admin password</h3><label>Current password</label><input id="cap" type="password" required><label>New password (min 6)</label><input id="ap" type="password" minlength="6" required><div class="err" style="color:var(--lt)">${esc(msg)}</div><button>Update password</button></form>`;
            }
            $("app").innerHTML = shell(u, [["orders", "Orders"], ["products", "Products"], ["customers", "Customers"]]) + `<main>${body}</main>`;
        }
        function editP(id, k, v) { const p = db.products.find(x => x.id === id); if (p) { p[k] = v; pDirty = true; save() } }
        function delP(id) { if (confirm("Delete this product?")) { db.products = db.products.filter(p => p.id !== id); db.cart = db.cart.filter(c => c.pid !== id); pDirty = true; save(); render() } }
        function addP(ev) { ev.preventDefault(); db.products.push({ id: uid("p"), name: $("pn").value.trim(), price: +$("pp").value, stock: +$("ps").value, available: true }); pDirty = true; save(); render(); return false }
        function delC(id) { if (confirm("Remove this customer?")) { db.users = db.users.filter(u => u.id !== id); save(); render() } }
        function admPass(ev) { ev.preventDefault(); DQAuth.changePassword(me().id, $("cap").value, $("ap").value, $("ap").value).then(() => { msg = "Password updated."; render() }).catch(err => { msg = err.message; render() }); return false }
        render();
    </script>
</body>

</html>
