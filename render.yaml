services:
  - type: web
    name: dreamquest
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: dreamquest-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/dreamquest.db
      - key: API_TOKEN
        sync: false